name: Deploy DoseCare site to GitHub Pages

on:
  # Trigger on push to main, but only when site/** changes.
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

# Allow one concurrent deploy; cancel in-progress runs to pick up the new commit.
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Approve esbuild / sharp install scripts (one-time per cache)
        run: npm config set ignore-scripts true && npm ci --ignore-scripts=false
        # The Astro build itself does not need esbuild/sharp; their
        # postinstall steps download platform-specific binaries. If
        # npm blocks them, the build will fail at the import step.
        # We accept-scripts to allow that on a fresh runner.

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
